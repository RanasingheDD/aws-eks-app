name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: [self-hosted]

    strategy:
      matrix:
        node-version: [18]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci
    - run: npm test

    # SonarQube
    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # Trivy (safer config)
    - name: Run Trivy scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        cache: 'false'

    # Docker build
    - name: Build Docker image
      run: |
        docker build -t ranasinghedd/node-app:v1 .

    # Docker login
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Push image
    - name: Push Docker image
      run: |
        docker push ranasinghedd/node-app:v1

  deploy: 
   needs: build
   runs-on: [self-hosted]
   steps:
    - name: docker pull image
      run: docker pull ranasinghedd/node-app:v1

    - name: Scan docker image
      uses: aquasecurity/trivy-action@v0.36.0
      with:
          image-ref: 'docker.io/ranasinghedd/node-app:v1'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

    - name: Deploy container
      run: docker run -d --name node-app -p 3000:3000 ranasinghedd/node-app:v1
